name: docs-platform-validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools package
        working-directory: tools
        run: python -m pip install -e ".[dev]"

      - name: Validate metadata
        working-directory: tools
        run: python -m pawsql_doc --root .. validate-metadata

      - name: Validate front matter
        working-directory: tools
        run: python -m pawsql_doc --root .. validate-frontmatter

      - name: Content model structure and quality report
        working-directory: tools
        run: python -m pawsql_doc --root .. quality --write-report

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality
          path: reports/content-quality.json

      - name: Regenerate references
        working-directory: tools
        run: python -m pawsql_doc --root .. build-references

      - name: References are committed (no diff after regeneration)
        run: |
          git diff --exit-code -- docs metadata/documentation/generated-manifest.json
          test -z "$(git ls-files --others --exclude-standard -- docs metadata/documentation/generated-manifest.json)"

      - name: Required-document existence gate (not publication approval)
        working-directory: tools
        run: python -m pawsql_doc --root .. drift && python -m pawsql_doc --root .. gate

      - name: Run unit tests
        working-directory: tools
        run: python -m pytest
