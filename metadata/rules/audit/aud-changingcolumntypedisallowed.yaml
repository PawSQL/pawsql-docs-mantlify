id: aud-changingcolumntypedisallowed
category: ddl
severity: warning
tags:
- review:ALTER TABLE MODIFY COLUMN
content:
  zh:
    name: 禁止修改列的数据类型
    description: '禁止直接修改列的数据类型。修改列的数据类型通常触发表重写与长时间锁表——数据库需要将全表数据按新类型转换后重新写入磁盘。在高并发生产环境中，这会导致索引失效、执行计划突变，并可能因隐式类型转换导致数据截断或语义改变，带来难以恢复的数据损毁风险。

      正确做法是通过新增新类型列、双写或触发器同步、分批回填校验、切换应用、最终下线旧列的灰度迁移方案完成变更，确保每个步骤可验证、可回滚。'
    badExample: '-- ❌ 不推荐：直接修改列类型，触发表重写，可能截断数据

      ALTER TABLE t MODIFY col VARCHAR(100);'
    goodExample: '-- ✅ 推荐：灰度迁移方案

      -- 1. ALTER TABLE t ADD COLUMN col_new VARCHAR(100);

      -- 2. 双写新旧列（应用层 / 触发器）

      -- 3. UPDATE t SET col_new = col WHERE col_new IS NULL;  -- 分批回填

      -- 4. 切换应用使用 col_new

      -- 5. ALTER TABLE t DROP COLUMN col;'
    summary: 禁止直接改列类型（全表重写/锁表/截断风险）；用灰度迁移：新列→双写→分批回填→切换→下线。
    editorial:
      status: draft
      owners: []
  en:
    name: ChangingColumnTypeDisallowed
    description: 'Directly changing a column''s data type is disallowed. Changing
      a column type usually triggers a full table rewrite and a long lock: the database
      must convert and rewrite all rows under the new type. In high-concurrency production
      this can invalidate indexes, change execution plans suddenly, and, through implicit
      type conversion, truncate data or change semantics - a hard-to-recover data-corruption
      risk.


      The right approach is a staged gray migration: add a column with the new type,
      keep both columns in sync (dual-write or triggers), backfill and validate in
      batches, switch the application, and finally drop the old column - each step
      verifiable and rollback-capable.'
    summary: 'Do not change a column type in place (full rewrite/lock/truncation risk);
      use a staged migration: new column, dual-write, batched backfill, switch, drop
      old.'
    badExample: '-- bad: changing the column type directly rewrites the table and
      may truncate data

      ALTER TABLE t MODIFY col VARCHAR(100);'
    goodExample: '-- good: staged gray migration

      -- 1. ALTER TABLE t ADD COLUMN col_new VARCHAR(100);

      -- 2. dual-write both columns (application / triggers)

      -- 3. UPDATE t SET col_new = col WHERE col_new IS NULL;  -- batched backfill

      -- 4. switch the application to col_new

      -- 5. ALTER TABLE t DROP COLUMN col;'
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
