id: aud-compressedattributedisallowed
category: ddl
severity: warning
tags:
- review:CREATE TABLE
- review:ALTER TABLE
content:
  zh:
    name: 禁止通过COMPRESSED打开字段压缩功能
    description: '在 `utf8` 及 `utf8mb4` 字符集下，通过 `COMPRESSED` 属性打开字段压缩功能容易出现乱码问题。此外，压缩和解压缩操作会消耗额外的
      CPU 资源，在高并发场景下可能成为性能瓶颈。

      数据压缩应在存储层或应用层解决（如 InnoDB 页压缩、操作系统级压缩），而非在列级别逐个字段开启。应避免在表定义中使用此功能。'
    badExample: "-- ❌ 不推荐：使用 COMPRESSED 属性\nCREATE TABLE t1 (\n    id INT,\n    long_text\
      \ TEXT COMPRESSED\n);"
    goodExample: "-- ✅ 推荐：不使用列级压缩，依赖存储引擎或应用层压缩方案\nCREATE TABLE t1 (\n    id INT,\n\
      \    long_text TEXT\n);"
    summary: 禁止用 COMPRESSED 做列级压缩（utf8/utf8mb4 易乱码、增 CPU 开销）；压缩放到存储/引擎层。
    editorial:
      status: draft
      owners: []
  en:
    name: CompressedAttributeDisallowed
    description: 'Turning on column-level compression through the `COMPRESSED` attribute
      is prone to mojibake under the `utf8` and `utf8mb4` character sets. Compression
      and decompression also consume extra CPU, which can become a bottleneck under
      high concurrency.


      Data compression should be handled at the storage or application layer (for
      example InnoDB page compression, or OS-level compression), not enabled column
      by column. Avoid this feature in table definitions.'
    summary: Do not enable column-level COMPRESSED (mojibake risk on utf8/utf8mb4,
      extra CPU); compress at the storage/engine or application layer instead.
    badExample: "-- bad: using the COMPRESSED attribute\nCREATE TABLE t1 (\n    id\
      \ INT,\n    long_text TEXT COMPRESSED\n);"
    goodExample: "-- good: no column-level compression; rely on storage-engine or\
      \ application-layer compression\nCREATE TABLE t1 (\n    id INT,\n    long_text\
      \ TEXT\n);"
    editorial:
      status: draft
      owners: []
kind: audit
