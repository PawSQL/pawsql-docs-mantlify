id: aud-ctas-naming-convention
category: ddl
severity: info
tags:
- review:CREATE TABLE AS SELECT
content:
  zh:
    name: CTAS 命名规范
    description: '`CREATE TABLE AS SELECT`（CTAS）语句创建的数据库对象名称应遵循统一的命名规范。规范的命名有助于团队协作和代码维护，不规范的命名会增加沟通成本、降低代码可读性，在跨团队协作时尤其容易引发误解。此规则要求 CTAS 创建的表名符合配置的正则表达式模式，确保数据库对象命名的一致性与可追溯性。'
    badExample: |-
      -- ❌ 不推荐：CTAS 创建的表名不符合命名规范
      CREATE TABLE MyDatabase (id INT) AS SELECT * FROM t;
    goodExample: |-
      -- ✅ 推荐：表名符合命名规范（如模式 ^{table}_ts$）
      CREATE TABLE t_ts (id INT) AS SELECT * FROM t;
  en:
    name: CTAS Naming Convention
