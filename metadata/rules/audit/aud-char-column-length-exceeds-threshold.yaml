id: aud-char-column-length-exceeds-threshold
category: ddl
severity: info
content:
  en:
    name: Char Column Length Exceeds Threshold
    description: When a CHAR column is declared longer than the configured threshold
      (64 by default) it should be reconsidered as VARCHAR. CHAR is stored at fixed
      length and consumes the declared width even when the actual data is short; for
      data with variable width, oversized CHAR columns bloat rows and indexes, increase
      I/O and memory usage, and reduce cache efficiency.
    whyItMatters: Fixed-width CHAR is only a good fit for values that are nearly always
      the same width. Switching over-long CHAR columns to VARCHAR enables dynamic
      storage, saves space, and improves query performance.
    howToFix: Change CHAR columns whose declared length exceeds the threshold (default
      64) to VARCHAR. This rule is configurable.
    badExample: "-- CHAR(10000) reserves 10000 chars even for short values\nCREATE\
      \ TABLE t (\n    content CHAR(10000)\n);\n"
    goodExample: "-- use VARCHAR for variable-width data\nCREATE TABLE t (\n    content\
      \ VARCHAR(10000)\n);\n"
    summary: Flag CHAR columns longer than the configurable threshold (default 64);
      oversized fixed-width CHAR bloat rows, indexes, and I/O. Recommend VARCHAR instead.
    editorial:
      status: draft
      owners: []
  zh:
    name: CHAR 字段长度超过阈值
    description: 当 CHAR 类型字段的长度超过一定阈值时，应考虑修改为 VARCHAR 类型。CHAR 类型采用定长存储，即使实际数据较短也会占用固定长度的存储空间；对于长度波动较大的数据，过长的
      CHAR 字段会导致行与索引膨胀、增加 I/O 与内存占用、降低缓存效率。将长度超过阈值的 CHAR 字段改为 VARCHAR 类型可以实现动态存储，节省空间并提升查询性能。
    howToFix: 将声明长度超过阈值（默认 64）的 CHAR 字段修改为 VARCHAR 类型。该规则可配置。
    badExample: "-- 不推荐：CHAR 字段长度过大（>64），应改为 VARCHAR\nCREATE TABLE t (\n    content\
      \ CHAR(10000)\n);\n"
    goodExample: "-- 推荐：将超长 CHAR 字段改为 VARCHAR 类型\nCREATE TABLE t (\n    content VARCHAR(10000)\n\
      );\n"
    summary: 检查声明长度超过阈值（默认 64）的 CHAR 字段：定长存储会让过大的 CHAR 膨胀行与索引、增加 I/O，建议改用 VARCHAR。
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
