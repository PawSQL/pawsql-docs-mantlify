id: aud-avoid-scalar-subqueries
category: dml
severity: info
tags:
- review:SELECT
content:
  zh:
    name: 避免使用标量子查询
    description: '标量子查询返回单行单列的值，它可以出现在 SQL 中任何单值出现的地方。标量子查询通常与外部查询相关联（相关子查询），数据库在运行时需要为每一行外查询的结果执行一次子查询，这种"逐行执行"的模式在大数据量场景下性能极差。此外，标量子查询在运行时才能确定是否只返回单行值，如果意外返回多行，还会导致运行时错误。

      建议尽可能使用 JOIN 或派生表来替代标量子查询，使优化器能够在一次批量操作中完成计算。PawSQL 会对标量子查询进行识别并在可行时自动提供重写建议。'
    badExample: '-- ❌ 不推荐：选择列表中的标量子查询，外层每行执行一次子查询

      SELECT id, (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS cnt FROM
      user u;'
    goodExample: '-- ✅ 推荐：使用 LEFT JOIN + GROUP BY 替代标量子查询

      SELECT u.id, COUNT(o.id) AS cnt

      FROM user u

      LEFT JOIN orders o ON o.user_id = u.id

      GROUP BY u.id;'
    summary: 避免标量子查询（外层每行执行一次、大表性能差、可能运行时多行报错）；用 JOIN/派生表替代。
    editorial:
      status: draft
      owners: []
  en:
    name: Avoid Scalar Subqueries
    description: 'A scalar subquery returns a single row and column, and can appear
      anywhere a single value can. Scalar subqueries are usually correlated with the
      outer query: the database executes the subquery once for every row of the outer
      result. This "row-by-row" execution performs very poorly on large data sets.
      In addition, whether a scalar subquery really returns one row is only known
      at run time - if it unexpectedly returns multiple rows, it causes a run-time
      error.


      Prefer replacing scalar subqueries with a JOIN or a derived table so the optimizer
      can do the work in one batched pass. PawSQL recognizes scalar subqueries and,
      when feasible, automatically offers a rewrite.'
    summary: Scalar subqueries run once per outer row and can fail at run time; prefer
      a JOIN or derived table.
    badExample: '-- bad: scalar subquery in the select list runs once per outer row

      SELECT id, (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS cnt FROM
      user u;'
    goodExample: '-- good: replace it with LEFT JOIN + GROUP BY

      SELECT u.id, COUNT(o.id) AS cnt

      FROM user u

      LEFT JOIN orders o ON o.user_id = u.id

      GROUP BY u.id;'
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
