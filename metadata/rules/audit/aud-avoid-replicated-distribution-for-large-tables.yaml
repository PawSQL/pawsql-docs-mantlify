id: aud-avoid-replicated-distribution-for-large-tables
category: ddl
severity: warning
tags:
- review:CREATE TABLE`（分布式环境）
content:
  zh:
    name: 大表不建议使用复制(Replicated)分布
    description: '在分布式数据库中，复制分布（Replicated Distribution）会将表的完整数据拷贝到集群的每一个节点上。对于小表而言，这种策略可以消除跨节点数据交换，提升JOIN性能；但对于大表，采用复制分布会显著增加存储开销（存储量
      = 原始数据大小 x 节点数），且写入操作需要同步到所有节点，丧失分布式并行计算的优势。

      该规则要求当表的数据量超过阈值（默认100,000行）时，不应使用REPLICATED分布方式，而应使用HASH分布或其他分片策略，以确保数据均匀分布在各节点上，充分利用分布式架构的扩展能力。'
    badExample: "-- ❌ 不推荐：大表使用复制分布，存储开销高且丧失分布式优势\nCREATE TABLE large_table (\n   \
      \ id BIGINT,\n    data TEXT\n) DISTRIBUTED BY REPLICATION;"
    goodExample: "-- ✅ 推荐：大表使用HASH分布，数据均匀分布在各个节点\nCREATE TABLE large_table (\n   \
      \ id BIGINT,\n    data TEXT\n) DISTRIBUTED BY HASH(id);"
    summary: 大表（默认超 10 万行）不宜用复制分布（存储与写放大）；应改用 HASH 等分片分布。
    editorial:
      status: draft
      owners: []
  en:
    name: Avoid Replicated Distribution for Large Tables
    description: 'In a distributed database, replicated distribution copies the full
      table to every node in the cluster. For small tables this removes cross-node
      data exchange and improves JOIN performance; but for large tables it multiplies
      storage cost (storage size = data size x node count) and every write must be
      replicated to all nodes, losing the advantage of distributed parallel computing.


      This rule requires that once a table''s row count exceeds the threshold (100,000
      rows by default), REPLICATED distribution must not be used; use HASH or another
      sharding strategy so data is spread evenly and the architecture''s scaling capability
      is fully used.'
    summary: Replicated distribution copies a table to every node; above the size
      threshold (default 100k rows) use HASH/sharded distribution instead.
    badExample: "-- bad: replicated distribution on a large table is costly and loses\
      \ distributed benefits\nCREATE TABLE large_table (\n    id BIGINT,\n    data\
      \ TEXT\n) DISTRIBUTED BY REPLICATION;"
    goodExample: "-- good: HASH distribution spreads a large table evenly across nodes\n\
      CREATE TABLE large_table (\n    id BIGINT,\n    data TEXT\n) DISTRIBUTED BY\
      \ HASH(id);"
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
  status: pending
