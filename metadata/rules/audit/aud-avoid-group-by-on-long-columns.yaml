id: aud-avoid-group-by-on-long-columns
category: dml
severity: warning
tags:
- review:SELECT
content:
  zh:
    name: 避免对长字段进行分组
    description: '在数据库中，GROUP BY 分组操作通常通过排序或哈希来实现，其时间复杂度和内存开销与参与分组的数据量及字段长度密切相关。如果需要分组的行数较多，单个字段的长度会显著影响分组效率——字段越长，排序比较或哈希计算的成本越高，临时空间占用也越大。

      此规则通过比较分组字段的长度是否超过用户设定的阈值来判断是否存在风险。默认阈值为 128 字符。如果分组字段的类型为 CHAR/VARCHAR 且长度超过阈值，或类型为
      CLOB/TEXT 等大对象类型，则会触发预警。'
    badExample: '-- ❌ 不推荐：对长度超过阈值的 VARCHAR 字段进行分组，效率低下

      SELECT long_description, COUNT(*) FROM products GROUP BY long_description;'
    goodExample: '-- ✅ 推荐：使用字段的哈希值或前缀来分组

      SELECT LEFT(long_description, 64), COUNT(*) FROM products GROUP BY LEFT(long_description,
      64);'
    summary: 避免对超长字段分组（CHAR/VARCHAR>128 或 CLOB/TEXT，排序/哈希开销大）；用前缀或哈希分组。
    editorial:
      status: draft
      owners: []
  en:
    name: Avoid GROUP BY on Long Columns
    description: 'GROUP BY is usually implemented by sorting or hashing, whose time
      and memory cost scale with the amount of data and the length of the grouped
      columns. With many rows to group, a long column degrades performance noticeably
      - longer values make each comparison or hash more expensive and consume more
      temporary space.


      This rule compares each grouped column''s length against a user-set threshold
      (128 characters by default). It warns when a CHAR/VARCHAR grouping column exceeds
      the threshold or is a large-object type such as CLOB/TEXT.'
    summary: Grouping by over-long columns (CHAR/VARCHAR above 128 or CLOB/TEXT) is
      slow; group by a prefix or hash instead.
    badExample: '-- bad: grouping by a VARCHAR longer than the threshold is inefficient

      SELECT long_description, COUNT(*) FROM products GROUP BY long_description;'
    goodExample: '-- good: group by a hash or a prefix of the column

      SELECT LEFT(long_description, 64), COUNT(*) FROM products GROUP BY LEFT(long_description,
      64);'
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
