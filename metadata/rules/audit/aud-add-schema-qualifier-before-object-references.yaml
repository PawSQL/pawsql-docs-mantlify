id: aud-add-schema-qualifier-before-object-references
category: dml
severity: info
tags:
- review:SELECT
- review:INSERT
- review:UPDATE
- review:DELETE`（所有引用数据库对象的语句）
content:
  zh:
    name: 对象前需添加属主
    description: '在进行SQL开发时，为每一个引用的数据库对象添加其所属的Schema/Owner标识（即使用`schema.object`的完整限定名），可以提升SQL语句的可读性以及后期的可维护性。这种做法使代码审查者能够快速确定每个对象的来源，避免因不同的Schema中存在同名对象而导致的歧义或错误引用。

      缺少属主前缀的SQL语句，在跨Schema访问或多租户环境下特别容易出现问题——查询可能意外访问到错误的Schema中的同名表或视图。'
    badExample: '-- ❌ 不推荐：未指定Schema，在跨Schema环境中可能引用错误表

      SELECT * FROM my_table;'
    goodExample: '-- ✅ 推荐：使用 schema.table 完整限定名，明确对象来源

      SELECT * FROM mydb.my_table;'
    summary: SQL 引用对象前加 Schema/属主限定（schema.object），避免跨 Schema/多租户下同名对象歧义与误引用。
    editorial:
      status: draft
      owners: []
  en:
    name: Add Schema Qualifier Before Object References
    description: 'When developing SQL, prefixing every referenced database object
      with its owning schema/owner (that is, using the fully qualified `schema.object`
      name) improves readability and long-term maintainability. It lets reviewers
      quickly tell where each object comes from and avoids ambiguity or wrong references
      caused by same-named objects in different schemas.


      Statements without a schema prefix are especially error-prone in cross-schema
      or multi-tenant environments - a query may accidentally reach a same-named table
      or view in the wrong schema.'
    summary: Prefix every referenced object with its schema/owner (schema.object)
      to avoid ambiguity and wrong references in cross-schema or multi-tenant setups.
    badExample: '-- bad: no schema qualifier; may reference the wrong table in a cross-schema
      environment

      SELECT * FROM my_table;'
    goodExample: '-- good: fully qualified schema.table makes the object source explicit

      SELECT * FROM mydb.my_table;'
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
  status: pending
