id: aud-avoid-limit-without-order-by-in-select
category: dml
severity: warning
tags:
- review:SELECT
content:
  zh:
    name: 避免在SELECT语句中使用LIMIT而没有ORDER BY
    description: '在 `SELECT` 语句中使用 `LIMIT` 而没有 `ORDER BY` 子句，会导致每次执行的结果不确定。数据库在没有排序指令的情况下，返回行的顺序是不保证的——它取决于存储引擎的物理存储顺序、查询执行计划的细节等因素，而这些因素在不同时间、不同版本下可能发生变化。

      如果业务逻辑依赖 `LIMIT` 返回"前 N 条"记录，必须同时指定 `ORDER BY` 来明确定义"前"的排序规则，确保结果的可重复性和正确性。PawSQL
      会检查此类写法并进行提醒。'
    badExample: '-- ❌ 不推荐：LIMIT 没有 ORDER BY，每次返回的行可能不同

      SELECT * FROM user LIMIT 10;'
    goodExample: '-- ✅ 推荐：明确指定 ORDER BY，确保结果稳定可重复

      SELECT * FROM user ORDER BY id LIMIT 10;'
    summary: SELECT 用 LIMIT 无 ORDER BY 时返回行不确定；加 ORDER BY 明确取哪前 N 行。
    editorial:
      status: draft
      owners: []
  en:
    name: Avoid LIMIT Without ORDER BY in SELECT
    description: 'Using `LIMIT` in a `SELECT` without an `ORDER BY` leaves the result
      undefined from run to run. With no ordering instruction, databases do not guarantee
      the order in which rows are returned - it depends on physical storage order,
      details of the execution plan, and other factors that can change across time
      and versions.


      If business logic relies on LIMIT returning the "first N" rows, you must also
      give an `ORDER BY` to define what "first" means, keeping results repeatable
      and correct. PawSQL checks for and reminds about this pattern.'
    summary: SELECT ... LIMIT without ORDER BY returns nondeterministic rows; always
      add ORDER BY to define which rows are returned.
    badExample: '-- bad: LIMIT without ORDER BY; the returned rows can differ each
      run

      SELECT * FROM user LIMIT 10;'
    goodExample: '-- good: explicit ORDER BY keeps the result stable and repeatable

      SELECT * FROM user ORDER BY id LIMIT 10;'
    editorial:
      status: draft
      owners: []
kind: audit
