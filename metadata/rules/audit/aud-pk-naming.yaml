id: aud-pk-naming
category: ddl
severity: info
content:
  en:
    name: Primary Key Naming Convention
    description: Primary-key constraint names should follow a single naming convention (for example pk_<table>_<columns>) so developers and DBAs can recognize the constraint type and the table it belongs to at a glance. Inconsistent names make schemas harder to read and slow down troubleshooting during schema changes or incident response.
    whyItMatters: 'Constraint naming is a readability and maintainability concern: a primary key whose name does not reveal its table adds cognitive cost in cross-team work and during database structure changes.'
    howToFix: Name primary-key constraints to match the configured pattern ^pk_{table}_{columns}$, e.g. create the primary key as pk_t_user_id for table t_user. This rule is configurable.
    badExample: |
      CREATE TABLE t_user (
          id BIGINT,
          name VARCHAR(50),
          CONSTRAINT pri_user PRIMARY KEY (id)
      );
    goodExample: |
      -- name follows pk_{table}_{columns}, e.g. pk_t_user_id
      CREATE TABLE t_user (
          id BIGINT,
          name VARCHAR(50),
          CONSTRAINT pk_t_user_id PRIMARY KEY (id)
      );
    summary: Primary-key constraints should follow one naming convention (e.g. pk_<table>_<columns>) so the constraint type and table are recognizable at a glance.
  zh:
    name: 主键命名规范
    description: 主键命名规范要求数据库对象名称遵循统一规范，便于团队协作和代码维护。统一的主键命名格式（如 pk_表名_列名）可以让开发人员和 DBA 快速识别约束类型和归属关系，降低沟通成本，在跨团队协作时尤其重要。不规范的命名会增加理解难度，降低代码可读性，在数据库结构变更和故障排查时容易引发误解。
    howToFix: 按配置的命名正则（^pk_{table}_{columns}$）为主键约束命名。例如 t_user 表的主键命名为 pk_t_user_id。该规则可配置。
    badExample: |
      -- 不推荐：主键名称不符合命名规范
      CREATE TABLE t_user (
          id BIGINT,
          name VARCHAR(50),
          CONSTRAINT pri_user PRIMARY KEY (id)
      );
    goodExample: |
      -- 推荐：主键名称符合规范（格式: pk_{table}_{columns}）
      CREATE TABLE t_user (
          id BIGINT,
          name VARCHAR(50),
          CONSTRAINT pk_t_user_id PRIMARY KEY (id)
      );
    summary: 主键约束命名应遵循统一规范（如 pk_表名_列名），便于快速识别约束类型与归属表，降低协作与排查成本。
