id: aud-avoid-multiple-distribution-keys
category: ddl
severity: warning
tags:
- review:CREATE TABLE`（分布式环境）
content:
  zh:
    name: 分布键不建议使用多个字段
    description: '使用多个字段作为分布键会限制表的水平扩展能力，影响分片（Sharding）的灵活性和路由效率。多列分布键会导致哈希计算复杂度增加，同时在表关联（JOIN）时需要所有分布键字段都匹配才能本地化执行，增加了优化器生成高效执行计划的难度。

      多列分布键还会增加跨节点数据移动的成本，因为数据重分布需要基于所有分布键列进行计算。建议尽可能使用单一字段作为分布键，优先选择查询关联中最频繁使用的连接字段。'
    badExample: "-- ❌ 不推荐：使用多字段作为分布键\nCREATE TABLE t_sales (\n    region    VARCHAR(50),\n\
      \    product   VARCHAR(50),\n    amount    DECIMAL(10, 2)\n) DISTRIBUTED BY\
      \ HASH (region, product);"
    goodExample: "-- ✅ 推荐：使用单一字段作为分布键\nCREATE TABLE t_sales (\n    region    VARCHAR(50),\n\
      \    product   VARCHAR(50),\n    amount    DECIMAL(10, 2)\n) DISTRIBUTED BY\
      \ HASH (region);"
    summary: 多列分布键限制水平扩展、增加哈希与本地化关联难度；建议用单一高频关联字段作分布键。
    editorial:
      status: draft
      owners: []
  en:
    name: Avoid Multiple Distribution Keys
    description: 'Using multiple columns as the distribution key restricts the table''s
      horizontal scalability and hurts sharding flexibility and routing efficiency.
      A multi-column distribution key raises hash-computation complexity, and table
      joins only localize when every distribution-key column matches, making it harder
      for the optimizer to build efficient plans.


      Multi-column distribution keys also increase the cost of moving data between
      nodes, because redistribution must be computed over all distribution-key columns.
      Prefer a single-column distribution key, ideally the column most frequently
      used as a join key in queries.'
    summary: Multiple-column distribution keys limit horizontal scaling, raise hashing
      cost, and block local joins unless every key matches; prefer a single, frequently-joined
      column.
    badExample: "-- bad: multiple columns as the distribution key\nCREATE TABLE t_sales\
      \ (\n    region    VARCHAR(50),\n    product   VARCHAR(50),\n    amount    DECIMAL(10,\
      \ 2)\n) DISTRIBUTED BY HASH (region, product);"
    goodExample: "-- good: a single column as the distribution key\nCREATE TABLE t_sales\
      \ (\n    region    VARCHAR(50),\n    product   VARCHAR(50),\n    amount    DECIMAL(10,\
      \ 2)\n) DISTRIBUTED BY HASH (region);"
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
