id: aud-insert-must-include-pk
category: dml
severity: warning
content:
  en:
    name: INSERT Must Include Primary Key Column
    description: For tables without an auto-increment primary key, INSERT statements
      should supply the primary-key value explicitly. Even when the primary-key column
      has a default value, omitting it can produce duplicates or values that do not
      match business expectations; in production, such statements risk primary-key
      conflicts and data inconsistency.
    howToFix: Add the primary-key column to the INSERT column list and provide an
      explicit value.
    badExample: '-- t has a non-auto-increment primary key, but INSERT omits it

      INSERT INTO user (name) VALUES (''张三'');

      '
    goodExample: '-- supply the primary-key value explicitly

      INSERT INTO user (id, name) VALUES (1, ''张三'');

      '
    summary: On tables without an auto-increment primary key, INSERT must supply the
      key explicitly to avoid duplicate or unexpected key values and data inconsistency.
    editorial:
      status: draft
      owners: []
  zh:
    name: INSERT 语句必须包含主键字段
    description: 对于没有自增主键的表，插入数据时应当显式指定主键的值。即使主键字段定义了默认值，省略主键字段也可能导致默认值重复或不符合业务预期。在生产环境中，缺失主键值的
      INSERT 语句可能导致主键冲突或数据不一致问题。
    howToFix: 在 INSERT 列清单中显式包含主键字段并提供明确的值。
    badExample: '-- 不推荐：表有非自增主键，但 INSERT 未包含主键字段

      INSERT INTO user (name) VALUES (''张三'');

      '
    goodExample: '-- 推荐：显式指定主键字段的值

      INSERT INTO user (id, name) VALUES (1, ''张三'');

      '
    summary: 对无自增主键的表，INSERT 必须显式包含主键列并提供明确的值，避免主键冲突与数据不一致。
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
  status: pending
