id: aud-order-by-forbidden-in-dml
category: dml
severity: warning
content:
  en:
    name: ORDER BY Forbidden in UPDATE/DELETE
    description: 'ORDER BY is usually meaningless in UPDATE or DELETE statements:
      the goal of a DML statement is to change data, not to return an ordered result
      set. Sorting adds unnecessary cost and can worsen the execution plan. In some
      databases (for example PostgreSQL) DELETE ... ORDER BY is even a syntax error
      unless combined with LIMIT, so the statement would fail outright.'
    howToFix: Remove the pointless ORDER BY from the DML statement. When ordering
      is actually needed to pick rows (for example the first N by some key), move
      the ordered selection into a subquery and drive the DML with a WHERE IN (...).
    badExample: '-- DELETE/UPDATE with an ORDER BY that adds no value

      DELETE FROM t ORDER BY id LIMIT 10;

      UPDATE t SET status = 1 ORDER BY created_at;

      '
    goodExample: "-- pick the rows in a subquery, then run the DML without ORDER BY\n\
      DELETE FROM t WHERE id IN (SELECT id FROM t ORDER BY id LIMIT 10);\nUPDATE t\
      \ SET status = 1 WHERE id IN (\n    SELECT id FROM t WHERE status = 0 ORDER\
      \ BY created_at LIMIT 100\n);\n"
    summary: ORDER BY is meaningless in UPDATE/DELETE, adds cost, and is a syntax
      error in some databases; remove it or move the ordered selection into a subquery.
    editorial:
      status: draft
      owners: []
  zh:
    name: UPDATE/DELETE 禁止使用 ORDER 子句
    description: 在 UPDATE 或 DELETE 语句中使用 ORDER BY 子句通常没有实际意义。DML 操作的目标是变更数据，而非返回有序结果集。ORDER
      BY 在 DML 中不仅增加了不必要的排序开销，还可能导致执行计划变差。在 PostgreSQL 等数据库中，DELETE ... ORDER BY 甚至是语法错误（除非配合
      LIMIT），直接使用将导致执行失败。
    howToFix: 移除 DML 语句中无意义的 ORDER BY。若确实需要按某种顺序取出部分行执行 DML（如取前 N 条），把排序放进子查询，再用 WHERE
      IN (...) 驱动更新或删除。
    badExample: '-- 不推荐：DELETE/UPDATE 中使用 ORDER BY 无意义

      DELETE FROM t ORDER BY id LIMIT 10;

      UPDATE t SET status = 1 ORDER BY created_at;

      '
    goodExample: "-- 推荐：在子查询中排序选取目标行，再执行 DML\nDELETE FROM t WHERE id IN (SELECT id\
      \ FROM t ORDER BY id LIMIT 10);\nUPDATE t SET status = 1 WHERE id IN (\n   \
      \ SELECT id FROM t WHERE status = 0 ORDER BY created_at LIMIT 100\n);\n"
    summary: UPDATE/DELETE 中 ORDER BY 无意义且增加开销，某些数据库甚至是语法错误；应移除或将排序放进子查询。
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
  status: pending
