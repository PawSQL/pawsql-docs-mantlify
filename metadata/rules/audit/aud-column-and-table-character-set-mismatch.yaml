id: aud-column-and-table-character-set-mismatch
category: ddl
severity: warning
tags:
- review:CREATE TABLE
- review:ALTER TABLE MODIFY COLUMN
content:
  zh:
    name: 列的字符集和表不一致
    description: '当列级别的字符集与表级别的字符集不一致时，可能导致隐式字符集转换、数据截断或乱码问题。在多语言环境下，字符集不一致还可能引发索引失效（MySQL
      中字符集不一致的字段进行 JOIN 时无法使用索引）和查询结果不符合预期等隐蔽性故障。

      建议在表级别统一指定字符集，各列继承表的字符集配置，避免个别列使用不同的字符集。保持一致的字符集策略是数据库设计的基本规范。'
    badExample: "-- ❌ 不推荐：列级别字符集与表级别不一致\nCREATE TABLE t_user (\n    name VARCHAR(50)\
      \ CHARSET latin1\n) DEFAULT CHARSET utf8mb4;"
    goodExample: "-- ✅ 推荐：列继承表的字符集，保持一致\nCREATE TABLE t_user (\n    name VARCHAR(50)\n\
      ) DEFAULT CHARSET utf8mb4;"
    summary: 列字符集应与表一致，避免隐式转换/乱码/JOIN 索引失效；列继承表字符集。
    editorial:
      status: draft
      owners: []
  en:
    name: Column and Table Character Set Mismatch
    description: 'When a column-level character set differs from the table-level one,
      it can cause implicit conversion, data truncation, or mojibake. In multi-language
      environments, mismatched character sets can also invalidate indexes (in MySQL,
      JOINing fields with different character sets cannot use an index) and produce
      query results that do not meet expectations - subtle failures.


      Set the character set uniformly at the table level and let columns inherit it,
      avoiding isolated columns with a different charset. A consistent charset strategy
      is a basic database-design norm.'
    summary: Column and table character sets must match to avoid conversion, truncation,
      mojibake, and JOIN index invalidation; columns should inherit the table charset.
    badExample: "-- bad: column-level charset differs from the table's\nCREATE TABLE\
      \ t_user (\n    name VARCHAR(50) CHARSET latin1\n) DEFAULT CHARSET utf8mb4;"
    goodExample: "-- good: the column inherits the table's charset\nCREATE TABLE t_user\
      \ (\n    name VARCHAR(50)\n) DEFAULT CHARSET utf8mb4;"
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
