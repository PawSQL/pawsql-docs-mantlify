id: aud-constraint-with-this-name-already-exists
category: ddl
severity: error
tags:
- review:ALTER TABLE ADD CONSTRAINT
content:
  zh:
    name: 约束名已存在
    description: '此规则确保在添加新约束时，约束名称在数据库中（或表内）是唯一的，避免与现有约束冲突。重复的约束名称会导致 SQL 执行失败，可能中断部署脚本或数据迁移流程。

      如果 SQL 语句添加了 `IF NOT EXISTS` 子句，则不会触发此规则告警。规范的约束命名和唯一性检查是数据库变更管理的基本要求。'
    badExample: '-- ❌ 不推荐：添加约束时名称与已存在的约束冲突

      ALTER TABLE orders ADD CONSTRAINT pk_orders PRIMARY KEY (order_id);'
    goodExample: '-- ✅ 推荐：添加 IF NOT EXISTS 或使用唯一约束名称

      ALTER TABLE orders ADD CONSTRAINT pk_orders_new PRIMARY KEY (order_id);'
    summary: 约束名须唯一，重名会使 DDL 失败并中断部署/迁移；可用 IF NOT EXISTS 或唯一命名。
    editorial:
      status: draft
      owners: []
  en:
    name: Constraint with this Name Already Exists
    description: 'This rule ensures constraint names are unique within the database
      (or table) when constraints are added, so they do not collide with existing
      ones. Duplicate constraint names make the SQL fail and can interrupt deployment
      scripts or data-migration flows.


      When the statement adds an `IF NOT EXISTS` clause, this rule does not fire.
      Consistent constraint naming and uniqueness checks are a basic requirement of
      schema-change management.'
    summary: Constraint names must be unique per database/table; a duplicate name
      fails the SQL and can break deployment or migration scripts.
    badExample: '-- bad: the constraint name collides with an existing one

      ALTER TABLE orders ADD CONSTRAINT pk_orders PRIMARY KEY (order_id);'
    goodExample: '-- good: use IF NOT EXISTS or a unique constraint name

      ALTER TABLE orders ADD CONSTRAINT pk_orders_new PRIMARY KEY (order_id);'
    editorial:
      status: draft
      owners: []
kind: audit
product: pawsql
applicability:
  status: pending
