# SAMPLE — example metadata, verify algorithm description against the product.
id: OPT-OR-UNION
name: OR to UNION Optimization
category: rewrite
severity: info
database:
  - mysql
  - postgresql
  - oracle
introducedVersion: 8.5.0
implementationClass: OrToUnionRule

description: >-
  Rewrites queries whose WHERE clause combines OR-ed predicates so the planner
  can consider separate access paths per branch, instead of one fused plan.

whyItMatters: >-
  When OR-ed branches involve different columns, a single-table plan cannot
  use an index per branch efficiently. Splitting the branches lets each one
  pick its own best index, and UNION ALL merges the results when the branches
  are provably disjoint.

howToFix: >-
  No manual action: PawSQL applies the rewrite automatically when it is safe.
  The rule is cost-based and only triggers when the rewritten plan is expected
  to be cheaper.

badExample: |
  SELECT * FROM t
  WHERE a = 1 OR b = 2;

goodExample: |
  -- after rewrite (UNION ALL applies when branches cannot overlap)
  SELECT * FROM t WHERE a = 1
  UNION ALL
  SELECT * FROM t WHERE b = 2 AND a <> 1;
