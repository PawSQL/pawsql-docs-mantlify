# Source: vault OR条件的SELECT重写.md. Product registration/version remain unverified.
id: OPT-OR-UNION
kind: optimizer
product: pawsql
category: rewrite
severity: info
database: [mysql, postgresql, oracle]
introducedVersion: 8.5.0
implementationClass: OrToUnionRule
applicability:
  status: pending
  prerequisites:
    - code: preserve-null-semantics
      content:
        zh: 分支排除条件必须保留 NULL 三值逻辑。
        en: Branch exclusion must preserve SQL three-valued NULL semantics.
    - code: preserve-multiplicity
      content:
        zh: 必须保留重复行；不能无条件用 UNION 去重代替 OR。
        en: Preserve row multiplicity; UNION deduplication is not an unconditional replacement for OR.
  exclusions:
    - code: volatile-predicates
      content:
        zh: 包含易变函数或副作用的谓词需要独立证明，不适用下面的示例推导。
        en: Volatile or side-effecting predicates require separate proof.
remediation:
  mode: conditional-auto
  requiresPerformanceValidation: true
content:
  zh:
    name: OR 条件 SELECT 重写
    summary: 拆分 OR 分支时保留 NULL 和重复行语义，再验证执行计划与性能。
    description: OR 拆分可以为各分支提供不同访问路径，但性能收益依赖数据库、数据分布与索引。以下示例说明语义约束，不构成对 PawSQL 引入版本、自动触发条件或所有方言支持的确认。
    whyItMatters: OR 查询保留输入行的重复次数；UNION 会去重，而简单的“不等于”排除条件会遗漏 NULL 行。
    howToFix: 对确定性谓词，将第二分支限制为第一分支不为真，再使用 UNION ALL。应用前验证方言、NULL、重复行和性能；产品自动改写行为仍待核实。
    editorial: {status: draft, owners: []}
  en:
    name: OR predicate rewrite
    summary: Preserve NULL semantics and row multiplicity when splitting OR branches, then verify performance.
    description: Splitting OR predicates may enable separate access paths. Benefit depends on the database, data distribution and indexes. These examples describe semantic constraints, not verified PawSQL version or triggering behavior.
    whyItMatters: OR retains input multiplicity. UNION deduplicates, while a simple inequality excludes NULL rows.
    howToFix: For deterministic predicates, restrict the second branch to rows where the first predicate is not true and combine with UNION ALL. Verify dialect support, semantics and performance before applying.
    editorial: {status: draft, owners: []}
examples:
  - id: disjoint-nonnull
    dialect: postgresql
    purpose: normal
    setupSql: |
      CREATE TABLE demo(a integer, b integer);
      INSERT INTO demo VALUES (1, 0), (2, 1), (2, 0);
    beforeSql: SELECT * FROM demo WHERE a = 1 OR b = 1;
    afterSql: |
      SELECT * FROM demo WHERE a = 1
      UNION ALL
      SELECT * FROM demo WHERE b = 1 AND (a <> 1 OR a IS NULL);
    expected: {comparison: multiset-equal}
    verification: pending
    content: {zh: 普通分支拆分, en: Normal branch splitting}
  - id: null-and-duplicates
    dialect: postgresql
    purpose: boundary
    setupSql: |
      CREATE TABLE demo(a integer, b integer);
      INSERT INTO demo VALUES (NULL, 1), (1, 1), (1, 1), (2, 1), (2, NULL);
    beforeSql: SELECT * FROM demo WHERE a = 1 OR b = 1;
    afterSql: |
      SELECT * FROM demo WHERE a = 1
      UNION ALL
      SELECT * FROM demo WHERE b = 1 AND (a <> 1 OR a IS NULL);
    expected: {comparison: multiset-equal}
    verification: pending
    content: {zh: NULL、重复行与分支重叠, en: 'NULL values, duplicates and overlapping branches'}
evidence: []
