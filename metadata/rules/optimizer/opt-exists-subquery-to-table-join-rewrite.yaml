id: opt-exists-subquery-to-table-join-rewrite
category: rewrite
severity: info
content:
  en:
    name: EXISTS Subquery to Table Join Rewrite
    description: An EXISTS subquery returns a boolean telling whether any matching
      row exists. When the correlation is an equality, the subquery result is unique,
      and the subquery has neither GROUP BY nor LIMIT, the EXISTS subquery can be
      rewritten into a JOIN. Rewriting to a join lets the optimizer choose the driving
      table freely and produce a better plan.
    howToFix: 'No manual action required: PawSQL detects convertible EXISTS subqueries
      and rewrites them into an equivalent inner join automatically, widening the
      set of plans the optimizer can consider.'
    badExample: '-- EXISTS subquery restricts which table the optimizer can drive
      from

      SELECT * FROM lineitem l

      WHERE EXISTS (SELECT * FROM part p WHERE p.p_partkey = l.l_partkey AND p.p_name
      = ''a'');

      '
    goodExample: '-- rewritten as a JOIN so the optimizer can pick the driving table

      SELECT l.* FROM lineitem AS l, part AS p

      WHERE p.p_partkey = l.l_partkey AND p.p_name = ''a'';

      '
    summary: Rewrites convertible EXISTS subqueries into an equivalent inner join
      so the optimizer can choose the driving table freely.
    editorial:
      status: draft
      owners: []
  zh:
    name: EXISTS 查询转换为表连接
    description: EXISTS 子查询向外层查询返回一个布尔值，表示是否存在满足条件的行。当满足一定条件时（等值关联、子查询结果唯一、无分组无 LIMIT），EXISTS
      子查询可以转换为 JOIN 表连接。转换为 JOIN 后，数据库优化器可以灵活选择驱动表，生成更优的查询计划，从而提升查询性能。
    howToFix: 无需人工处理：PawSQL 自动识别可转换的 EXISTS 子查询模式，将其重写为等价的内连接形式，为优化器提供更丰富的执行计划选择空间。
    badExample: '-- 不推荐：EXISTS 子查询限制了优化器对驱动表的选择

      SELECT * FROM lineitem l

      WHERE EXISTS (SELECT * FROM part p WHERE p.p_partkey = l.l_partkey AND p.p_name
      = ''a'');

      '
    goodExample: '-- 推荐：转换为 JOIN，优化器可灵活选择驱动表

      SELECT l.* FROM lineitem AS l, part AS p

      WHERE p.p_partkey = l.l_partkey AND p.p_name = ''a'';

      '
    summary: 将可转换的 EXISTS 子查询重写为等价内连接，让优化器可自由选择驱动表。
    editorial:
      status: draft
      owners: []
kind: optimizer
product: pawsql
applicability:
  status: pending
