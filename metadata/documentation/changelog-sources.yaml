# 变更日志（changelog）的源码来源配置。
#
# 每个源写自己的 changelog 页面：pages 指定「语言 -> 页面相对路径」，工具只往该页的
# CHANGELOG 标记区里写内容，页面不存在则跳过并告警（不会创建页面）。
#
# 版本轴是 git tag 区间：工具取「上一个 tag .. 当前 tag」之间的提交。
# 两个源码仓目前都还没有可用的 tag —— server 的 86 个 tag 是 2023 年遗留
# （多个指向同一提交），engine 一个都没有。tag 补上之前，工具会跳过该源并告警。
#
# repo 支持 ${VAR} 与 ${VAR:-默认值} 展开，便于在不同机器/CI 上覆盖：
#   PAWSQL_CHANGELOG_SERVER_REPO / PAWSQL_CHANGELOG_ENGINE_REPO

sources:
  - name: server
    displayName:
      zh: 服务端
      en: Server
    repo: ${PAWSQL_CHANGELOG_SERVER_REPO:-E:/gitrepo/pawsql-server}
    trunk: main
    # 历史 tag 有两种形状：release-v0.1.0 为主，另有 3 个遗留的 release-v.0.2.0。
    tagPattern: '^release-v\.?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    # 2022–2023 的 86 个遗留 tag（0.1.x–0.4.x）全部落在 main 上，且指向同一批老提交；
    # 不设下限它们会各自渲染成一条假发布。server 的版本轴从回填的 1.2.1 起。
    minVersion: '1.2.1'
    # 暂时只写中文页：条目文本保留提交的原始语言，英文页要等中英条目口径
    # 定下来再启用（届时加 pages.en 并建 docs/en/changelog/server/index.mdx）。
    pages:
      zh: docs/changelog/server/index.mdx
    # 提交风格是规范 Conventional Commits（feat/fix/refactor/chore/docs）。
    # 下面这些前缀不进 changelog：对外无可见变化。
    skipPrefixes: [chore, docs, test, ci, build, style]
    skipMerge: true

  - name: engine
    displayName:
      zh: 引擎
      en: Engine
    repo: ${PAWSQL_CHANGELOG_ENGINE_REPO:-E:/Workspace/pawsql-core}
    trunk: master
    # tag 已由 tag-releases 按边界表回填（engine-v1.2.0 起，见 changelog-release-boundaries.yaml）；
    # 收紧成唯一种写法，避免误匹配将来无关的 vX.Y.Z tag。
    tagPattern: '^engine-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    # 页面先不建（engine 一个 tag 都没有，建了也是空页）；补 tag 后按模板建
    # docs/changelog/engine/index.mdx 即可，工具对不存在的页面只告警不报错。
    pages:
      zh: docs/changelog/engine/index.mdx
    # 引擎提交是中文自由描述、无类型前缀，只能靠 LLM 判定是否对外可见。
    skipPrefixes: []
    skipMerge: true
    # 解析器内部路径与文档改动不作为对外变更的依据。
    pathExclude:
      - docs/
      - "*.md"
      - .github/
